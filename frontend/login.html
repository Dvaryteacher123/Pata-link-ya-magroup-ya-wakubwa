<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Pata Link WhatsApp Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader-container">
            <div class="loader-logo"><i class="fas fa-comments"></i></div>
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- Login Page -->
    <div class="auth-page">
        <div class="auth-bg">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>
            <div class="auth-orb auth-orb-3"></div>
        </div>

        <div class="auth-container">
            <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-logo"><i class="fas fa-comments"></i><span>Pata Link</span></div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Login to your account</p>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email" />
                        <div class="form-error" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password" />
                            <button type="button" class="password-toggle" id="togglePassword"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="form-error" id="loginPasswordError"></div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" />
                            <span class="checkmark"></span> Remember Me
                        </label>
                        <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn" id="loginBtn">
                        <span id="loginBtnText">Login</span>
                        <div class="spinner" id="loginSpinner" style="display:none;"></div>
                    </button>

                    <div class="form-error" id="loginError" style="display:none;"></div>
                </form>

                <p class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>

                <div class="auth-support">
                    <i class="fas fa-headset"></i>
                    <span>Need help? </span>
                    <a href="mailto:dullamanyama0@gmail.com">Contact Support</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
