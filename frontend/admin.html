<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Pata Link WhatsApp Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader-container">
            <div class="loader-logo"><i class="fas fa-comments"></i></div>
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- Admin Login Page -->
    <div class="auth-page">
        <div class="auth-bg">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>
            <div class="auth-orb auth-orb-3"></div>
        </div>

        <div class="auth-container">
            <a href="index.html" class="auth-back">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>

            <div class="auth-card">
                <!-- Admin Badge -->
                <div style="text-align:center;margin-bottom:var(--spacing-md);">
                    <span style="display:inline-flex;align-items:center;gap:8px;padding:4px 16px;background:rgba(79,70,229,0.2);border:1px solid rgba(79,70,229,0.3);border-radius:50px;font-size:12px;font-weight:600;color:#4F46E5;">
                        <i class="fas fa-shield-alt"></i> Admin Panel
                    </span>
                </div>

                <div class="auth-logo">
                    <i class="fas fa-comments"></i>
                    <span>Pata Link</span>
                </div>

                <h1 class="auth-title">Admin Login</h1>
                <p class="auth-subtitle">Login to manage your website</p>

                <form id="adminLoginForm" class="auth-form">
                    <div class="form-group">
                        <label for="adminEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="adminEmail" placeholder="Enter admin email" required />
                        <div class="form-error" id="adminEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="adminPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="adminPassword" placeholder="Enter admin password" required />
                            <button type="button" class="password-toggle" id="toggleAdminPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="form-error" id="adminPasswordError"></div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="adminRememberMe" />
                            <span class="checkmark"></span>
                            Remember Me
                        </label>
                        <a href="#" class="forgot-link" id="adminForgotLink">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn" id="adminLoginBtn">
                        <span id="adminLoginBtnText">Login</span>
                        <div class="spinner" id="adminLoginSpinner" style="display:none;"></div>
                    </button>

                    <div class="form-error" id="adminLoginError" style="display:none;"></div>
                </form>

                <div class="auth-support">
                    <i class="fas fa-headset"></i>
                    <span>Need help? </span>
                    <a href="mailto:dullamanyama0@gmail.com">Contact Support</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
