<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Pata Link WhatsApp Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader-container">
            <div class="loader-logo"><i class="fas fa-comments"></i></div>
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- Signup Page -->
    <div class="auth-page">
        <div class="auth-bg">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>
            <div class="auth-orb auth-orb-3"></div>
        </div>

        <div class="auth-container">
            <a href="index.html" class="auth-back"><i class="fas fa-arrow-left"></i> Back to Home</a>

            <div class="auth-card">
                <div class="auth-logo"><i class="fas fa-comments"></i><span>Pata Link</span></div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Pata Link WhatsApp Groups</p>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="signupName"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required autocomplete="name" />
                        <div class="form-error" id="signupNameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required autocomplete="email" />
                        <div class="form-error" id="signupEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupPhone"><i class="fas fa-phone"></i> Phone Number <span style="color:var(--text-muted);font-weight:400;font-size:12px;">(Optional)</span></label>
                        <input type="tel" id="signupPhone" placeholder="Enter your phone number" autocomplete="tel" />
                        <div class="form-error" id="signupPhoneError"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupPassword" placeholder="Create a strong password" required autocomplete="new-password" />
                            <button type="button" class="password-toggle" id="toggleSignupPassword"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="form-error" id="signupPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword"><i class="fas fa-check-circle"></i> Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required autocomplete="new-password" />
                            <button type="button" class="password-toggle" id="toggleConfirmPassword"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="form-error" id="signupConfirmError"></div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="termsCheckbox" required />
                            <span class="checkmark"></span>
                            I agree to the <a href="#" style="color:var(--primary-blue);text-decoration:none;">Terms of Service</a> and <a href="#" style="color:var(--primary-blue);text-decoration:none;">Privacy Policy</a>
                        </label>
                        <div class="form-error" id="termsError"></div>
                    </div>

                    <button type="submit" class="auth-btn" id="signupBtn">
                        <span id="signupBtnText">Create Account</span>
                        <div class="spinner" id="signupSpinner" style="display:none;"></div>
                    </button>

                    <div class="form-error" id="signupError" style="display:none;"></div>
                </form>

                <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>

                <div class="auth-support">
                    <i class="fas fa-headset"></i>
                    <span>Need help? </span>
                    <a href="mailto:dullamanyama0@gmail.com">Contact Support</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
