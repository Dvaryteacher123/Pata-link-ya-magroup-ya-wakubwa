<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Pata Link WhatsApp Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader-container">
            <div class="loader-logo"><i class="fas fa-comments"></i></div>
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- 404 Page -->
    <div class="auth-page">
        <div class="auth-bg">
            <div class="auth-orb auth-orb-1"></div>
            <div class="auth-orb auth-orb-2"></div>
            <div class="auth-orb auth-orb-3"></div>
        </div>

        <div class="auth-container" style="max-width:500px;">
            <div class="auth-card" style="text-align:center;">

                <!-- 404 Illustration -->
                <div style="font-size:80px;font-weight:900;line-height:1;margin-bottom:var(--spacing-md);">
                    <span style="color:var(--primary-blue);">4</span>
                    <span style="color:var(--primary-purple);">
                        <i class="fas fa-comments" style="font-size:64px;"></i>
                    </span>
                    <span style="color:var(--primary-blue);">4</span>
                </div>

                <h1 class="auth-title" style="font-size:32px;">Oops! Page Not Found</h1>
                <p class="auth-subtitle">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

                <div style="display:flex;gap:var(--spacing-md);justify-content:center;flex-wrap:wrap;margin:var(--spacing-lg) 0;">
                    <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--gradient-primary);color:white;border-radius:var(--radius-sm);text-decoration:none;font-weight:600;transition:var(--transition-fast);">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                    <a href="dashboard.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);border-radius:var(--radius-sm);text-decoration:none;font-weight:600;transition:var(--transition-fast);">
                        <i class="fas fa-tachometer-alt"></i> Dashboard
                    </a>
                </div>

                <div class="auth-support">
                    <i class="fas fa-headset"></i>
                    <span>Need help? </span>
                    <a href="mailto:dullamanyama0@gmail.com">Contact Support</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
