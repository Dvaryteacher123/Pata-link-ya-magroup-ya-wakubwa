<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=no">
    <title>Dvary Groups - Nunua Link za WhatsApp</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e91e8c;
            --primary-dark: #c2187b;
            --primary-light: #f8e1f0;
            --gradient: linear-gradient(145deg, #f06292, #ba68c8);
            --bg-light: #fceef5;
            --white: #ffffff;
            --shadow: 0 8px 30px rgba(233, 30, 140, 0.10);
            --shadow-hover: 0 12px 40px rgba(233, 30, 140, 0.18);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --card-bg: #ffffff;
            --text-color: #1a1a2e;
            --text-secondary: #6b6b7b;
            --border-color: rgba(233, 30, 140, 0.08);
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-light: #12121e;
            --white: #1a1a2e;
            --card-bg: #1a1a2e;
            --text-color: #eaeaea;
            --text-secondary: #9a9aaa;
            --border-color: rgba(233, 30, 140, 0.15);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: var(--font);
            background: var(--bg-light);
            color: var(--text-color);
            padding: 0;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 14px 24px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 8px;
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--bg-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }
        .header .logo {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .logo i {
            -webkit-text-fill-color: initial;
            color: var(--primary);
            font-size: 1.3rem;
        }
        .header .right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .right .nav-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-color);
            cursor: pointer;
            position: relative;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header .right .nav-icon:hover {
            background: var(--primary-light);
        }
        .header .right .nav-icon .badge {
            position: absolute;
            top: 0;
            right: 0;
            background: #e91e8c;
            color: white;
            font-size: 0.5rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-light);
        }
        .header .right .theme-toggle {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-color);
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header .right .theme-toggle:hover {
            background: var(--primary-light);
        }

        /* ===== SEARCH BAR ===== */
        .search-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin: 12px 0 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .search-container i {
            color: var(--primary);
            font-size: 1rem;
        }
        .search-container input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            outline: none;
            color: var(--text-color);
            font-family: var(--font);
        }
        .search-container input::placeholder {
            color: var(--text-secondary);
        }

        /* ===== HERO ===== */
        .hero {
            background: var(--gradient);
            padding: 22px 20px;
            border-radius: var(--radius-lg);
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 12px 35px rgba(233, 30, 140, 0.25);
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 250px;
            height: 250px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }
        .hero .hero-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
            display: block;
        }
        .hero h1 {
            font-size: 1.4rem;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }
        .hero p {
            opacity: 0.9;
            font-size: 0.85rem;
            margin-top: 4px;
            position: relative;
            z-index: 2;
        }

        /* ===== NOTIFICATION BANNER ===== */
        .notification-banner {
            background: #d4edda;
            color: #155724;
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            border: 1px solid #c3e6cb;
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            animation: fadeUp 0.4s ease;
        }
        .notification-banner i {
            font-size: 1.2rem;
        }
        [data-theme="dark"] .notification-banner {
            background: #1a3a2a;
            color: #66bb6a;
            border-color: #2a5a3a;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 12px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
        }
        .section-title i {
            color: var(--primary);
            margin-right: 8px;
        }

        /* ===== GROUP CARDS - PREMIUM ===== */
        .groups-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .group-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            animation: fadeUp 0.4s ease;
            display: flex;
            flex-direction: column;
        }
        .group-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .group-card .group-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: #f0e6ea;
        }

        .group-card .group-body {
            padding: 14px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .group-card .group-body .group-info {
            flex: 1;
        }
        .group-card .group-body h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 2px;
        }
        .group-card .group-body .group-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .group-card .group-body .group-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .group-card .group-body .group-price small {
            font-weight: 400;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .group-card .buy-btn {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(233, 30, 140, 0.2);
            margin-top: 4px;
        }
        .group-card .buy-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(233, 30, 140, 0.3);
        }
        .group-card .buy-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .group-card .buy-btn i {
            font-size: 0.9rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 2.5rem;
            color: #ddd;
            margin-bottom: 10px;
        }
        [data-theme="dark"] .empty-state i {
            color: #444;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            max-width: 400px;
            width: 100%;
            padding: 24px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease;
        }
        .modal-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-color);
        }
        .modal-box .sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 14px;
        }
        .modal-box .price-display {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin: 4px 0 14px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 60px;
            font-size: 0.9rem;
            margin: 6px 0 14px;
            background: var(--bg-light);
            transition: var(--transition);
            outline: none;
            color: var(--text-color);
        }
        .modal-box input:focus {
            border-color: var(--primary);
        }
        .modal-box .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .modal-box .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
        }
        .modal-box .btn-primary {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(233, 30, 140, 0.2);
        }
        .modal-box .btn-primary:hover {
            transform: scale(1.02);
        }
        .modal-box .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .modal-box .btn-secondary {
            background: #f0edf3;
            color: #444;
        }
        [data-theme="dark"] .modal-box .btn-secondary {
            background: #2a2a4a;
            color: #ccc;
        }
        .modal-box .btn-secondary:hover {
            background: #e5e0e8;
        }
        [data-theme="dark"] .modal-box .btn-secondary:hover {
            background: #3a3a5a;
        }

        .modal-box .payment-message {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }
        .modal-box .payment-message.error {
            display: block;
            background: #fce4ec;
            color: #b71c1c;
        }
        .modal-box .payment-message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .modal-box .payment-message.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 24px;
        }
        .footer .footer-text {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .footer .footer-text span {
            color: var(--primary);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 400px) {
            .hero h1 { font-size: 1.2rem; }
            .hero { padding: 18px 16px; }
            .hero .hero-icon { font-size: 1.5rem; }
            .header .logo { font-size: 1rem; }
            .search-container { padding: 10px 14px; }
            .search-container input { font-size: 0.85rem; }
            .group-card .group-img { height: 120px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-crown"></i> Dvary Groups
            </div>
            <div class="right">
                <button class="theme-toggle" id="themeToggle" title="Change Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="nav-icon" id="notifToggle" title="Notifications" style="display:none;">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="notifBadge">0</span>
                </button>
            </div>
        </header>

        <!-- ===== SEARCH BAR ===== -->
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchGroups" placeholder="🔍 Tafuta group / Search groups..." />
        </div>

        <!-- ===== HERO ===== -->
        <section class="hero">
            <span class="hero-icon"><i class="fas fa-rocket"></i></span>
            <h1>Dvary WhatsApp Groups</h1>
            <p>Chagua group ulipendeleo, fanya malipo na ujiunge papo hapo!</p>
        </section>

        <!-- ===== NOTIFICATION BANNER ===== -->
        <div id="notificationBanner" class="notification-banner">
            <i class="fas fa-info-circle"></i>
            <strong id="notificationText"></strong>
        </div>

        <!-- ===== GROUPS SECTION ===== -->
        <div class="section-title">
            <span><i class="fas fa-layer-group"></i> Magroup Yanayopatikana</span>
        </div>
        <div id="groupsList" class="groups-grid">
            <div class="empty-state">
                <i class="fas fa-spinner fa-pulse"></i>
                <p>Inapakia magroup...</p>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <p class="footer-text">© 2026 <span>Dvary Groups</span> - All Rights Reserved</p>
        </div>

        <!-- ===== PAYMENT MODAL ===== -->
        <div class="modal-overlay" id="paymentModal">
            <div class="modal-box">
                <h3 id="modalGroupName">Kamilisha Malipo</h3>
                <div class="sub">Unanunua link ya group</div>
                <div class="price-display" id="modalGroupPrice">TZS 0</div>
                
                <div class="payment-message" id="paymentMessage"></div>
                
                <p style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;">
                    <i class="fas fa-phone"></i> Weka namba yako ya simu kupokea USSD Push:
                </p>
                <input type="tel" id="clientPhone" placeholder="Namba ya Simu (Mf. 0712345678)" />
                
                <div class="btn-group">
                    <button class="btn-primary" id="confirmPayBtn">
                        <span id="payBtnText">Lipa Sasa</span>
                        <span class="spinner" id="payLoading"></span>
                    </button>
                    <button class="btn-secondary" id="closeModalBtn">Ghairi</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== FIREBASE + LOGIC ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ===== STATE =====
        let activeGroup = null;
        let isProcessing = false;

        // ===== DOM REFS =====
        const groupsList = document.getElementById('groupsList');
        const searchInput = document.getElementById('searchGroups');
        const notificationBanner = document.getElementById('notificationBanner');
        const notificationText = document.getElementById('notificationText');

        // ===== THEME TOGGLE =====
        let isDark = false;
        document.getElementById('themeToggle').addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            const icon = document.getElementById('themeToggle').querySelector('i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        // ===== LOAD NOTIFICATION =====
        async function loadNotification() {
            try {
                const notifDoc = await getDoc(doc(db, "settings", "notification"));
                if (notifDoc.exists()) {
                    const data = notifDoc.data();
                    notificationText.innerText = data.message;
                    notificationBanner.style.display = 'flex';
                }
            } catch (err) {
                console.error("Imeshindwa kupakia notification:", err);
            }
        }

        // ===== LOAD GROUPS =====
        async function loadGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                
                if (querySnapshot.empty) {
                    groupsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <p>Hakuna magroup yaliyowekwa kwa sasa.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const group = docSnap.data();
                    const image = group.image || 'https://via.placeholder.com/400x150/f8e1f0/e91e8c?text=Dvary+Group';
                    
                    html += `
                        <div class="group-card" data-name="${(group.name || '').toLowerCase()}" data-desc="${(group.description || '').toLowerCase()}">
                            <img src="${image}" alt="${group.name}" class="group-img" loading="lazy" />
                            <div class="group-body">
                                <div class="group-info">
                                    <h3>${group.name || 'Group'}</h3>
                                    <div class="group-desc">${group.description || 'Premium WhatsApp Group'}</div>
                                    <div class="group-price">TZS ${group.price || 0} <small>/ link</small></div>
                                </div>
                                <button class="buy-btn" data-id="${docSnap.id}">
                                    <i class="fas fa-shopping-cart"></i> Nunua Link
                                </button>
                            </div>
                        </div>
                    `;
                });

                groupsList.innerHTML = html;

                // Attach buy button events
                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const id = btn.dataset.id;
                        const snap = await getDoc(doc(db, "groups", id));
                        if (snap.exists()) {
                            activeGroup = { id: snap.id, ...snap.data() };
                            openPaymentModal(activeGroup);
                        }
                    });
                });

                // Apply search filter if there's a search term
                if (searchInput.value.trim()) {
                    filterGroups(searchInput.value);
                }

            } catch (error) {
                groupsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Hitilafu imetokea wakati wa kupakia magroup.</p>
                    </div>
                `;
                console.error(error);
            }
        }

        // ===== SEARCH FUNCTIONALITY =====
        function filterGroups(searchTerm) {
            const cards = document.querySelectorAll('.group-card');
            const term = searchTerm.toLowerCase().trim();
            let hasVisible = false;
            
            cards.forEach(card => {
                const name = card.dataset.name || '';
                const desc = card.dataset.desc || '';
                const match = name.includes(term) || desc.includes(term);
                card.style.display = match ? 'flex' : 'none';
                if (match) hasVisible = true;
            });

            // Show empty state if no results
            const emptyState = document.querySelector('.groups-grid .empty-state');
            if (!hasVisible && !document.querySelector('.groups-grid .empty-state')) {
                const grid = document.querySelector('.groups-grid');
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.innerHTML = `
                    <i class="fas fa-search"></i>
                    <p>Hakuna group inayofanana na "<strong>${searchTerm}</strong>"</p>
                `;
                grid.appendChild(empty);
            } else if (hasVisible) {
                const existingEmpty = document.querySelector('.groups-grid .empty-state:last-child');
                if (existingEmpty && !existingEmpty.querySelector('.fa-spinner')) {
                    existingEmpty.remove();
                }
            }
        }

        searchInput.addEventListener('input', (e) => {
            filterGroups(e.target.value);
        });

        // ===== PAYMENT MODAL =====
        function openPaymentModal(group) {
            document.getElementById('modalGroupName').textContent = group.name || 'Group';
            document.getElementById('modalGroupPrice').textContent = `TZS ${group.price || 0}`;
            document.getElementById('clientPhone').value = '';
            document.getElementById('paymentMessage').className = 'payment-message';
            document.getElementById('paymentMessage').textContent = '';
            document.getElementById('paymentModal').classList.add('active');
            document.getElementById('payBtnText').style.display = 'inline';
            document.getElementById('payLoading').style.display = 'none';
            isProcessing = false;
            activeGroup = group;
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('paymentModal').classList.remove('active');
        });

        // Close modal on backdrop click
        document.getElementById('paymentModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('paymentModal').classList.remove('active');
            }
        });

        // ===== CONFIRM PAYMENT - INTEGRATED WITH HARAKAPAY =====
        document.getElementById('confirmPayBtn').addEventListener('click', async () => {
            if (isProcessing) return;
            
            const phone = document.getElementById('clientPhone').value.trim();
            const messageEl = document.getElementById('paymentMessage');
            
            // Reset message
            messageEl.className = 'payment-message';
            messageEl.textContent = '';

            // Validate phone
            if (!phone || phone.length < 7) {
                messageEl.className = 'payment-message error';
                messageEl.textContent = '❌ Tafadhali weka namba halali ya simu.';
                return;
            }

            // Format phone - if starts with 0, keep as is for HarakaPay
            let formattedPhone = phone;
            if (phone.startsWith('0') && phone.length === 10) {
                formattedPhone = phone;
            } else if (phone.startsWith('255') && phone.length === 12) {
                formattedPhone = '0' + phone.substring(3);
            } else if (phone.startsWith('+255')) {
                formattedPhone = '0' + phone.substring(4);
            } else if (phone.length === 9 && !phone.startsWith('0')) {
                formattedPhone = '0' + phone;
            }

            if (!formattedPhone.startsWith('0') || formattedPhone.length !== 10) {
                messageEl.className = 'payment-message error';
                messageEl.textContent = '❌ Namba ya simu si sahihi. Tumia 0712345678.';
                return;
            }

            if (!activeGroup) {
                messageEl.className = 'payment-message error';
                messageEl.textContent = '❌ Hitilafu: Group haijachaguliwa.';
                return;
            }

            // Start processing
            isProcessing = true;
            document.getElementById('payBtnText').style.display = 'none';
            document.getElementById('payLoading').style.display = 'inline-block';

            messageEl.className = 'payment-message info';
            messageEl.textContent = '⏳ Inatuma ombi la malipo...';

            try {
                // ============================================================
                // CALL SERVER API TO INITIATE HARAKAPAY PAYMENT
                // ============================================================
                const response = await fetch('/api/payment/initiate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: formattedPhone,
                        amount: activeGroup.price || 1000,
                        description: `Malipo ya group: ${activeGroup.name}`,
                        userId: 'guest_user',
                        productName: activeGroup.name,
                        productId: activeGroup.id,
                        clientName: 'Mteja wa Dvary'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageEl.className = 'payment-message success';
                    messageEl.innerHTML = `
                        ✅ Ombi la malipo limetumwa kwa simu yako (${formattedPhone})!
                        <br><small>Order ID: ${result.data?.paymentReference || 'N/A'}</small>
                        <br><small>Thibitisha kwenye simu yako kukamilisha malipo.</small>
                    `;
                    
                    // Reset button after delay
                    setTimeout(() => {
                        document.getElementById('paymentModal').classList.remove('active');
                        document.getElementById('payBtnText').style.display = 'inline';
                        document.getElementById('payLoading').style.display = 'none';
                        isProcessing = false;
                    }, 5000);
                    
                } else {
                    messageEl.className = 'payment-message error';
                    messageEl.textContent = '❌ ' + (result.message || 'Malipo yameshindikana. Jaribu tena.');
                    
                    document.getElementById('payBtnText').style.display = 'inline';
                    document.getElementById('payLoading').style.display = 'none';
                    isProcessing = false;
                }

            } catch (error) {
                console.error('Payment error:', error);
                messageEl.className = 'payment-message error';
                messageEl.textContent = '❌ Hitilafu ya mtandao. Hakikisha server iko online.';
                
                document.getElementById('payBtnText').style.display = 'inline';
                document.getElementById('payLoading').style.display = 'none';
                isProcessing = false;
            }
        });

        // ===== LOAD DATA =====
        loadNotification();
        loadGroups();

        console.log('🚀 Dvary Groups - Premium Design with HarakaPay Integration');
        console.log('📦 Connected to Firestore');
        console.log('💳 Payment API endpoint: /api/payment/initiate');
        console.log('📱 Phone format: 0712345678 (0 + 9 digits)');
    </script>

</body>
</html>
