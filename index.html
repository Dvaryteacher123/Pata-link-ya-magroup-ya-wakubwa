<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=no" />
    <title>Dvary Groups - Nunua Link za WhatsApp</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e91e8c;
            --primary-dark: #c2187b;
            --primary-light: #f8e1f0;
            --gradient: linear-gradient(145deg, #f06292, #ba68c8);
            --bg-light: #fceef5;
            --white: #ffffff;
            --shadow: 0 8px 30px rgba(233, 30, 140, 0.10);
            --shadow-hover: 0 12px 40px rgba(233, 30, 140, 0.18);
            --radius: 16px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --card-bg: #ffffff;
            --text-color: #1a1a2e;
            --text-secondary: #6b6b7b;
            --border-color: rgba(233, 30, 140, 0.08);
        }
        [data-theme="dark"] {
            --bg-light: #12121e;
            --white: #1a1a2e;
            --card-bg: #1a1a2e;
            --text-color: #eaeaea;
            --text-secondary: #9a9aaa;
            --border-color: rgba(233, 30, 140, 0.15);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        body { font-family: var(--font); background: var(--bg-light); color: var(--text-color); min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }
        .app-wrapper { max-width: 480px; width: 100%; margin: 0 auto; padding: 12px 14px 24px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; position: sticky; top: 0; z-index: 40; background: var(--bg-light); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
        .header .logo { font-size: 1.1rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 6px; }
        .header .logo i { -webkit-text-fill-color: initial; color: var(--primary); }
        .header .right { display: flex; align-items: center; gap: 6px; }
        .header .right button { background: none; border: none; font-size: 1rem; color: var(--text-color); cursor: pointer; padding: 6px; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        .header .right button:hover { background: var(--primary-light); }

        /* Menu Juu */
        .top-nav { display: flex; align-items: center; gap: 6px; padding: 10px 0; overflow-x: auto; border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
        .top-nav::-webkit-scrollbar { display: none; }
        .top-nav .nav-link { display: flex; align-items: center; gap: 5px; padding: 7px 14px; border-radius: 30px; color: var(--text-secondary); text-decoration: none; font-size: 0.75rem; font-weight: 500; cursor: pointer; border: none; background: var(--card-bg); box-shadow: var(--shadow); white-space: nowrap; flex-shrink: 0; }
        .top-nav .nav-link:hover { background: var(--primary-light); color: var(--primary); }
        .top-nav .nav-link.active { background: var(--gradient); color: white; box-shadow: 0 4px 14px rgba(233, 30, 140, 0.25); }

        .search-container { background: var(--card-bg); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0 14px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .search-container i { color: var(--primary); }
        .search-container input { flex: 1; border: none; background: transparent; font-size: 0.85rem; outline: none; color: var(--text-color); }

        .hero { background: var(--gradient); padding: 18px; border-radius: var(--radius-lg); color: white; margin-bottom: 16px; box-shadow: 0 12px 35px rgba(233, 30, 140, 0.25); }
        .hero h1 { font-size: 1.3rem; font-weight: 700; }
        .hero p { opacity: 0.9; font-size: 0.8rem; margin-top: 2px; }

        .section-title { margin: 16px 0 10px; font-size: 0.95rem; font-weight: 600; color: var(--text-color); display: flex; align-items: center; gap: 6px; }
        .section-title i { color: var(--primary); }

        .groups-grid { display: flex; flex-direction: column; gap: 12px; }
        .group-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .group-card img { width: 100%; height: 130px; object-fit: cover; background: #f0e6ea; }
        .group-card .group-body { padding: 12px 14px 14px; }
        .group-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 2px; }
        .group-card .group-desc { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; }
        .group-card .group-price { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
        .group-card .buy-btn { width: 100%; padding: 10px; background: var(--gradient); color: white; border: none; border-radius: 60px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* Sehemu ya Oda */
        .orders-section { display: none; }
        .orders-section.active { display: block; }
        .main-content.hidden { display: none; }
        .order-card { background: var(--card-bg); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .order-info h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
        .order-info p { font-size: 0.75rem; color: var(--text-secondary); }
        .order-status { font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .order-status.pending { background: #fff3e0; color: #ef6c00; }
        .order-status.completed { background: #e8f5e9; color: #2e7d32; }

        /* Modal ya Malipo */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--card-bg); border-radius: var(--radius-lg); max-width: 400px; width: 100%; padding: 22px 18px; box-shadow: 0 30px 60px rgba(0,0,0,0.2); border: 1px solid var(--border-color); }
        .modal-box h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 2px; }
        .modal-box .price-display { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin: 6px 0 12px; }
        .modal-box input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border-color); border-radius: 60px; font-size: 0.85rem; margin: 4px 0 12px; background: var(--bg-light); outline: none; color: var(--text-color); }
        .modal-box .btn-group { display: flex; gap: 8px; }
        .modal-box button { flex: 1; padding: 10px; border: none; border-radius: 60px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .modal-box .btn-primary { background: var(--gradient); color: white; }
        .modal-box .btn-secondary { background: #f0edf3; color: #444; }
        .payment-message { padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 10px; display: none; }
        .payment-message.error { display: block; background: #fce4ec; color: #b71c1c; }
        .payment-message.success { display: block; background: #e8f5e9; color: #2e7d32; }
        .payment-message.info { display: block; background: #e3f2fd; color: #0d47a1; }
        .empty-state { text-align: center; padding: 30px 16px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="header">
            <div class="logo"><i class="fas fa-crown"></i> Dvary Groups</div>
            <div class="right">
                <button id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <!-- Menu Juu -->
        <nav class="top-nav">
            <button class="nav-link active" id="navGroups" onclick="switchTab('groups')"><i class="fas fa-store"></i> Magroup</button>
            <button class="nav-link" id="navOrders" onclick="switchTab('orders')"><i class="fas fa-box-open"></i> Oda Zangu</button>
            <button class="nav-link" onclick="window.location.href='/chat'"><i class="fas fa-comments"></i> Chat</button>
            <button class="nav-link" onclick="window.location.href='/setting'"><i class="fas fa-cog"></i> Setting</button>
            <button class="nav-link" onclick="window.location.href='/dashboard'"><i class="fas fa-user"></i> Dashboard</button>
            <button class="nav-link" onclick="window.location.href='/login'"><i class="fas fa-sign-in-alt"></i> Ingia</button>
        </nav>

        <!-- Sehemu ya Magroup -->
        <div id="groupsContent" class="main-content">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchGroups" placeholder="Tafuta group..." />
            </div>

            <section class="hero">
                <h1>Dvary WhatsApp Groups</h1>
                <p>Chagua group ulipendalo, fanya malipo na ujiunge papo hapo!</p>
            </section>

            <div class="section-title"><i class="fas fa-layer-group"></i> Magroup Yanayopatikana</div>
            <div id="groupsList" class="groups-grid">
                <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>Inapakia magroup...</p></div>
            </div>
        </div>

        <!-- Sehemu ya Oda Zangu -->
        <div id="ordersContent" class="orders-section">
            <div class="section-title"><i class="fas fa-history"></i> Historia ya Oda Zako</div>
            <div id="ordersList" class="groups-grid">
                <div class="empty-state"><p>Bado hujafanya oda yoyote.</p></div>
            </div>
        </div>

        <!-- Modal ya Malipo -->
        <div class="modal-overlay" id="paymentModal">
            <div class="modal-box">
                <h3 id="modalGroupName">Kamilisha Malipo</h3>
                <div style="font-size:0.8rem;color:var(--text-secondary);">Unanunua link ya group</div>
                <div class="price-display" id="modalGroupPrice">TZS 0</div>
                <div class="payment-message" id="paymentMessage"></div>
                <input type="tel" id="clientPhone" placeholder="Namba ya Simu (Mf. 0712345678)" />
                <div class="btn-group">
                    <button class="btn-primary" id="confirmPayBtn">Lipa Sasa</button>
                    <button class="btn-secondary" id="closeModalBtn">Ghairi</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let activeGroup = null;

        // Kazi ya Kubadili Tab
        window.switchTab = function(tab) {
            const groupsContent = document.getElementById('groupsContent');
            const ordersContent = document.getElementById('ordersContent');
            const navGroups = document.getElementById('navGroups');
            const navOrders = document.getElementById('navOrders');

            if (tab === 'groups') {
                groupsContent.classList.remove('hidden');
                ordersContent.classList.remove('active');
                navGroups.classList.add('active');
                navOrders.classList.remove('active');
            } else {
                groupsContent.classList.add('hidden');
                ordersContent.classList.add('active');
                navOrders.classList.add('active');
                navGroups.classList.remove('active');
                loadOrders();
            }
        }

        let isDark = false;
        document.getElementById('themeToggle').addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggle').querySelector('i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        });

        async function loadGroups() {
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                const groupsList = document.getElementById('groupsList');
                if (querySnapshot.empty) {
                    groupsList.innerHTML = `<div class="empty-state"><p>Hakuna magroup kwa sasa.</p></div>`;
                    return;
                }
                let html = '';
                querySnapshot.forEach((docSnap) => {
                    const group = docSnap.data();
                    html += `
                        <div class="group-card">
                            <img src="${group.image || 'https://via.placeholder.com/400x130'}" alt="Group" />
                            <div class="group-body">
                                <h3>${group.name}</h3>
                                <div class="group-desc">${group.description || ''}</div>
                                <div class="group-price">TZS ${group.price || 0}</div>
                                <button class="buy-btn" data-id="${docSnap.id}"><i class="fas fa-shopping-cart"></i> Nunua Link</button>
                            </div>
                        </div>`;
                });
                groupsList.innerHTML = html;

                document.querySelectorAll('.buy-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const snap = await getDoc(doc(db, "groups", btn.dataset.id));
                        if (snap.exists()) {
                            activeGroup = { id: snap.id, ...snap.data() };
                            document.getElementById('modalGroupName').textContent = activeGroup.name;
                            document.getElementById('modalGroupPrice').textContent = `TZS ${activeGroup.price}`;
                            document.getElementById('paymentModal').classList.add('active');
                        }
                    });
                });
            } catch (e) { console.error(e); }
        }

        async function loadOrders() {
            const ordersList = document.getElementById('ordersList');
            const savedPhone = localStorage.getItem('client_phone');
            
            if (!savedPhone) {
                ordersList.innerHTML = `<div class="empty-state"><p>Hujaweka namba ya simu au hujafanya malipo bado.</p></div>`;
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                let html = '';
                let found = false;

                querySnapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    if (order.phone === savedPhone) {
                        found = true;
                        const statusText = order.status === 'completed' ? 'Imekamilika' : 'Inasubiri';
                        const statusClass = order.status === 'completed' ? 'completed' : 'pending';
                        html += `
                            <div class="order-card">
                                <div class="order-info">
                                    <h4>${order.groupName}</h4>
                                    <p>Simu: ${order.phone} | TZS ${order.amount}</p>
                                </div>
                                <div class="order-status ${statusClass}">${statusText}</div>
                            </div>`;
                    }
                });

                ordersList.innerHTML = found ? html : `<div class="empty-state"><p>Huna oda zilizopatikana kwa namba hii.</p></div>`;
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('paymentModal').classList.remove('active');
        });

        document.getElementById('confirmPayBtn').addEventListener('click', async () => {
            const phone = document.getElementById('clientPhone').value.trim();
            const msg = document.getElementById('paymentMessage');
            if (!phone || phone.length < 9) {
                msg.className = 'payment-message error';
                msg.textContent = 'Weka namba halali ya simu.';
                return;
            }

            localStorage.setItem('client_phone', phone);

            msg.className = 'payment-message info';
            msg.textContent = 'Inatuma ombi la malipo...';

            try {
                await addDoc(collection(db, "orders"), {
                    phone: phone,
                    groupName: activeGroup.name,
                    amount: activeGroup.price,
                    status: 'pending',
                    createdAt: new Date()
                });

                const res = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: phone,
                        amount: activeGroup.price,
                        description: `Malipo ya group: ${activeGroup.name}`,
                        webhook_url: 'https://pata-link-ya-magroup-ya-wakubwa.onrender.com/webhook'
                    })
                });
                const result = await res.json();
                if (res.ok) {
                    msg.className = 'payment-message success';
                    msg.textContent = 'Ombi limetumwa kwenye simu yako! Tafadhali thibitisha.';
                } else {
                    throw new Error(result.error || 'Imeshindikana');
                }
            } catch (err) {
                msg.className = 'payment-message error';
                msg.textContent = 'Hitilafu: ' + err.message;
            }
        });

        loadGroups();
    </script>
</body>
</html>
