<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HarakaPay Digital Links - Tanzania</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C3CE1;
            --primary-dark: #5A2FC7;
            --primary-light: #8B6AE8;
            --primary-gradient: linear-gradient(135deg, #6C3CE1, #9B6BFF);
            --success: #00C853;
            --warning: #FFD600;
            --danger: #FF1744;
            --info: #2979FF;

            --bg-primary: #0A0A1A;
            --bg-secondary: #14142E;
            --bg-card: #14142E;
            --bg-card-hover: #1A1A3A;
            --bg-input: #0A0A1A;

            --text-primary: #FFFFFF;
            --text-secondary: #A0A0C0;
            --text-muted: #6A6A8A;

            --border-color: #2A2A4A;
            --shadow: 0 8px 32px rgba(108, 60, 225, 0.15);
            --shadow-lg: 0 16px 48px rgba(108, 60, 225, 0.25);

            --radius: 16px;
            --radius-sm: 8px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .navbar-brand i {
            font-size: 28px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-brand h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-brand span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            -webkit-text-fill-color: var(--text-muted);
            margin-left: 4px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-actions .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px 16px;
            gap: 10px;
            transition: var(--transition);
        }

        .navbar-actions .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.15);
        }

        .navbar-actions .search-box input {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            width: 180px;
            font-family: inherit;
        }

        .navbar-actions .search-box input::placeholder {
            color: var(--text-muted);
        }

        .navbar-actions .search-box i {
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-btn:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .nav-btn .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 20px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
        }

        .mobile-menu-btn {
            display: none;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 20px;
        }

        /* ===== MAIN ===== */
        .main-content {
            margin-top: 80px;
            padding: 24px 32px 40px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== HERO ===== */
        .hero {
            background: var(--primary-gradient);
            border-radius: var(--radius-lg);
            padding: 48px 56px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h2 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .hero .hero-badges {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero .hero-badges span {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        /* ===== CATEGORIES ===== */
        .categories-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 0 20px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: var(--radius-lg);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .category-chip:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .category-chip.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
        }

        /* ===== PRODUCTS ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-header h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .product-card .product-image {
            width: 100%;
            height: 200px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 48px;
            overflow: hidden;
        }

        .product-card .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-card .product-body {
            padding: 18px 20px 20px;
        }

        .product-card .product-body .product-tag {
            display: inline-block;
            background: rgba(108, 60, 225, 0.15);
            color: var(--primary-light);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-card .product-body .product-tag.free {
            background: rgba(0, 200, 83, 0.15);
            color: var(--success);
        }

        .product-card .product-body h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-card .product-body .product-desc {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-card .product-body .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-card .product-body .product-price {
            font-size: 20px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-card .product-body .product-price.free {
            background: var(--success);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .product-card .product-body .btn-buy {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: var(--radius-lg);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .product-card .product-body .btn-buy:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 48px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .empty-state h4 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: 100%;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.4s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }
        .toast.info {
            border-left: 4px solid var(--info);
        }

        .toast .toast-icon {
            font-size: 20px;
        }

        .toast .toast-content {
            flex: 1;
        }

        .toast .toast-title {
            font-weight: 600;
            font-size: 14px;
        }

        .toast .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== LOADING SKELETON ===== */
        .skeleton {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .skeleton-image {
            height: 200px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .skeleton-title {
            height: 18px;
            width: 70%;
            margin-bottom: 8px;
        }

        .skeleton-desc {
            height: 12px;
            width: 90%;
            margin-bottom: 6px;
        }

        .skeleton-price {
            height: 20px;
            width: 40%;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 16px;
            }

            .navbar-actions .search-box {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .main-content {
                padding: 16px 16px 80px;
                margin-top: 70px;
            }

            .hero {
                padding: 32px 24px;
                border-radius: var(--radius);
            }

            .hero h2 {
                font-size: 26px;
            }

            .hero p {
                font-size: 15px;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 16px;
            }

            .product-card .product-image {
                height: 140px;
            }

            .product-card .product-body {
                padding: 14px 16px 16px;
            }

            .product-card .product-body h4 {
                font-size: 14px;
            }

            .product-card .product-body .product-price {
                font-size: 16px;
            }

            .product-card .product-body .btn-buy {
                padding: 6px 14px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-card .product-image {
                height: 120px;
            }

            .product-card .product-body {
                padding: 10px 12px 14px;
            }

            .product-card .product-body h4 {
                font-size: 13px;
            }

            .product-card .product-body .product-desc {
                font-size: 11px;
                -webkit-line-clamp: 1;
            }

            .product-card .product-body .product-price {
                font-size: 14px;
            }

            .product-card .product-body .btn-buy {
                padding: 4px 10px;
                font-size: 11px;
            }

            .navbar-brand h1 {
                font-size: 18px;
            }

            .hero h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <a href="/" class="navbar-brand">
            <i class="fas fa-bolt"></i>
            <div>
                <h1>HarakaPay <span>Digital</span></h1>
            </div>
        </a>

        <div class="navbar-actions">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Tafuta bidhaa..." id="searchInput" oninput="searchProducts(this.value)" />
            </div>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="main-content">
        <!-- HERO -->
        <div class="hero">
            <div class="hero-content">
                <h2>Pata Bidhaa Zako za Digital Papo hapo</h2>
                <p>Nunua links, subscriptions, na bidhaa nyingine za digital kwa haraka na salama kupitia HarakaPay.</p>
                <div class="hero-badges">
                    <span><i class="fas fa-bolt"></i> USSD Push</span>
                    <span><i class="fas fa-shield-alt"></i> Salama</span>
                    <span><i class="fas fa-clock"></i> Papo hapo</span>
                    <span><i class="fas fa-phone"></i> TZS</span>
                </div>
            </div>
        </div>

        <!-- CATEGORIES -->
        <div class="categories-scroll" id="categoriesContainer">
            <span class="category-chip active" data-category="all" onclick="filterCategory('all')">Zote</span>
            <span class="category-chip" data-category="Streaming" onclick="filterCategory('Streaming')">📺 Streaming</span>
            <span class="category-chip" data-category="Gaming" onclick="filterCategory('Gaming')">🎮 Gaming</span>
            <span class="category-chip" data-category="Education" onclick="filterCategory('Education')">📚 Education</span>
            <span class="category-chip" data-category="Utilities" onclick="filterCategory('Utilities')">🔧 Utilities</span>
            <span class="category-chip" data-category="Other" onclick="filterCategory('Other')">📦 Other</span>
        </div>

        <!-- PRODUCTS -->
        <div class="section-header">
            <h3>🔥 Bidhaa Zetu</h3>
            <span style="color:var(--text-muted); font-size:13px;" id="productCount"></span>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Skeleton Loading -->
            <div class="product-card">
                <div class="skeleton skeleton-image"></div>
                <div class="product-body">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-desc"></div>
                    <div class="product-footer">
                        <div class="skeleton skeleton-price"></div>
                        <div class="skeleton" style="width:80px; height:34px; border-radius:20px;"></div>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <div class="skeleton skeleton-image"></div>
                <div class="product-body">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-desc"></div>
                    <div class="product-footer">
                        <div class="skeleton skeleton-price"></div>
                        <div class="skeleton" style="width:80px; height:34px; border-radius:20px;"></div>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <div class="skeleton skeleton-image"></div>
                <div class="product-body">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-desc"></div>
                    <div class="product-footer">
                        <div class="skeleton skeleton-price"></div>
                        <div class="skeleton" style="width:80px; height:34px; border-radius:20px;"></div>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <div class="skeleton skeleton-image"></div>
                <div class="product-body">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-desc"></div>
                    <div class="product-footer">
                        <div class="skeleton skeleton-price"></div>
                        <div class="skeleton" style="width:80px; height:34px; border-radius:20px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT - READS FROM FIRESTORE VIA BACKEND
    ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION - NO AUTHENTICATION REQUIRED!
        // ============================================================
        const API_BASE = window.location.origin + '/api';
        let allProducts = [];

        console.log('🔗 API Base URL:', API_BASE);
        console.log('🌐 Domain:', window.location.origin);

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.4s ease';
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 5000);
        }

        // ============================================================
        // MOBILE MENU
        // ============================================================
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            if (menu) {
                menu.classList.toggle('open');
            }
        }

        // ============================================================
        // PRODUCTS - READS FROM FIRESTORE VIA BACKEND
        // ============================================================
        async function loadProducts(category = 'all') {
            try {
                console.log('📡 Loading products from:', API_BASE + '/products');

                const url = category === 'all' ?
                    `${API_BASE}/products` :
                    `${API_BASE}/products?category=${category}`;

                const res = await fetch(url);

                console.log('📡 Response status:', res.status);

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }

                const data = await res.json();

                console.log('📡 Products data:', data);

                if (data.success && data.products) {
                    allProducts = data.products;
                    renderProducts(data.products);
                    document.getElementById('productCount').textContent = `${data.count} bidhaa`;
                } else {
                    console.warn('⚠️ No products found:', data);
                    renderProducts([]);
                }
            } catch (error) {
                console.error('❌ Load products error:', error);
                renderProducts([]);
                showToast('error', 'Error', 'Failed to load products: ' + error.message);

                // Show error in grid
                const grid = document.getElementById('productGrid');
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                            <h4>Imeshindwa Kupakia Bidhaa</h4>
                            <p>${error.message}</p>
                            <button onclick="loadProducts()" style="background:var(--primary-gradient); color:white; border:none; padding:10px 24px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; margin-top:12px;">
                                <i class="fas fa-sync"></i> Jaribu Tena
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');

            if (!products || products.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            <h4>Hakuna bidhaa</h4>
                            <p>Hakuna bidhaa inayopatikana kwa sasa. Tafadhali rudi baadaye.</p>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = products.map(p => {
                const isFree = p.price === 0 || p.price === '0';
                const priceDisplay = isFree ? 'BURE' : `TZS ${parseInt(p.price).toLocaleString()}`;
                const priceClass = isFree ? 'free' : '';

                return `
                    <div class="product-card">
                        <div class="product-image">
                            ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'" />` : `<i class="fas fa-image"></i>`}
                        </div>
                        <div class="product-body">
                            <span class="product-tag ${isFree ? 'free' : ''}">${p.category || 'General'}</span>
                            <h4>${p.title || 'Untitled'}</h4>
                            <div class="product-desc">${p.description || 'No description'}</div>
                            <div class="product-footer">
                                <span class="product-price ${priceClass}">${priceDisplay}</span>
                                <button class="btn-buy" onclick="showToast('info', 'Coming Soon', 'Payment system coming soon!')">
                                    ${isFree ? 'Claim' : 'Nunua'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.category === category);
            });

            loadProducts(category);
        }

        function searchProducts(query) {
            if (!query.trim()) {
                loadProducts();
                return;
            }

            const filtered = allProducts.filter(p =>
                p.title?.toLowerCase().includes(query.toLowerCase()) ||
                p.description?.toLowerCase().includes(query.toLowerCase()) ||
                p.category?.toLowerCase().includes(query.toLowerCase())
            );

            renderProducts(filtered);
            document.getElementById('productCount').textContent = `${filtered.length} matokeo`;
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page loaded - Loading products...');
            loadProducts();

            // Set up search
            document.getElementById('searchInput').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    searchProducts(this.value);
                }
            });
        });

        console.log('%c🚀 HarakaPay Digital Links', 'font-size:20px; font-weight:bold; color:#6C3CE1;');
        console.log('%c✅ Products read from Firestore via backend', 'color:#00C853;');
        console.log('%c📌 No authentication required', 'color:#A0A0C0;');
        console.log('%c🔗 API: ' + API_BASE, 'color:#A0A0C0;');
    </script>
</body>
  </html>
