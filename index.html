<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dvary Groups - Nunua Link za WhatsApp</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        .notification-banner { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; display: none; }
        .group-card { background: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0px 0px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .group-info h3 { margin: 0 0 5px 0; color: #2c3e50; }
        .group-info p { margin: 0; font-size: 15px; color: #e67e22; font-weight: bold; }
        button { padding: 10px 15px; background-color: #25D366; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #128C7E; }
        
        /* Modal ya Malipo */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .close-btn { background-color: #e74c3c; margin-top: 10px; }
        .close-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dvary WhatsApp Groups</h1>
            <p>Chagua group ulipendalo, fanya malipo na ujiunge papo hapo!</p>
        </header>

        <!-- Sehemu ya Notification / Offer inayotoka Firestore -->
        <div id="notificationBanner" class="notification-banner">
            <strong id="notificationText"></strong>
        </div>

        <h2>Magroup Yanayopatikana</h2>
        <div id="groupsList">
            <p>Inapakia magroup...</p>
        </div>
    </div>

    <!-- Modal ya Malipo ya HarakaPay -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalGroupName">Kamilisha Malipo</h3>
            <p id="modalGroupPrice"></p>
            <p style="font-size: 13px; color: #666;">Weka namba yako ya simu ya mtandao (Mf. 0712345678) kupokea USSD Push:</p>
            <input type="text" id="clientPhone" placeholder="Namba ya Simu" required>
            <button id="confirmPayBtn">Lipa Sasa</button>
            <br>
            <button class="close-btn" id="closeModalBtn">Ghairi</button>
        </div>
    </div>

    <!-- Firebase SDK na Skrini ya Maonyesho -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Taarifa zako sahihi za Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCmwASW4XXQ3O0AvsCM_r1WLlrUmGjYVxI",
            authDomain: "dvary-9a7d0.firebaseapp.com",
            projectId: "dvary-9a7d0",
            storageBucket: "dvary-9a7d0.firebasestorage.app",
            messagingSenderId: "107370806066",
            appId: "1:107370806066:web:4c2ce1e6f7b6c32909f52b",
            measurementId: "G-07361LFJEP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeGroup = null;

        // 1. Kusoma Notification / Offer kutoka Firestore
        async function loadNotification() {
            try {
                const notifDoc = await getDoc(doc(db, "settings", "notification"));
                if (notifDoc.exists()) {
                    const data = notifDoc.data();
                    const banner = document.getElementById('notificationBanner');
                    document.getElementById('notificationText').innerText = data.message;
                    banner.style.display = 'block';
                }
            } catch (err) {
                console.error("Imeshindwa kupakia notification:", err);
            }
        }

        // 2. Kusoma Orodha ya Magroup yote pamoja na Picha kutoka Firestore
        async function loadGroups() {
            const listContainer = document.getElementById('groupsList');
            try {
                const querySnapshot = await getDocs(collection(db, "groups"));
                if (querySnapshot.empty) {
                    listContainer.innerHTML = "<p>Hakuna magroup yaliyowekwa kwa sasa.</p>";
                    return;
                }

                listContainer.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const group = docSnap.data();
                    
                    const card = document.createElement('div');
                    card.className = 'group-card';
                    card.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${group.image || 'https://via.placeholder.com/60'}" alt="Picha" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;">
                            <div class="group-info">
                                <h3>${group.name}</h3>
                                <p>TZS ${group.price}</p>
                            </div>
                        </div>
                    `;

                    const buyBtn = document.createElement('button');
                    buyBtn.innerText = 'Nunua Link';
                    buyBtn.onclick = () => openPaymentModal(group);
                    
                    card.appendChild(buyBtn);
                    listContainer.appendChild(card);
                });
            } catch (error) {
                listContainer.innerHTML = "<p>Hitilafu imetokea wakati wa kupakia magroup.</p>";
                console.error(error);
            }
        }

        function openPaymentModal(group) {
            activeGroup = group;
            document.getElementById('modalGroupName').innerText = group.name;
            document.getElementById('modalGroupPrice').innerText = `Bei: TZS ${group.price}`;
            document.getElementById('paymentModal').style.display = 'flex';
        }

        document.getElementById('closeModalBtn').onclick = () => {
            document.getElementById('paymentModal').style.display = 'none';
        };

        // 3. Kuanzisha Malipo kupitia Server yetu na HarakaPay API
        document.getElementById('confirmPayBtn').onclick = async () => {
            const phone = document.getElementById('clientPhone').value;
            if (!phone) {
                alert("Tafadhali weka namba ya simu.");
                return;
            }

            alert("Inatuma ombi la malipo kwenda kwenye simu yako...");

            try {
                const response = await fetch('/api/pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: phone,
                        amount: activeGroup.price,
                        description: `Malipo ya group: ${activeGroup.name}`,
                        webhook_url: 'https://domainyako.com/webhook'
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert(`Ombi la malipo limetumwa! Order ID: ${result.order_id}. Weka namba ya siri kwenye simu yako kukamilisha.`);
                    document.getElementById('paymentModal').style.display = 'none';
                } else {
                    alert("Imeshindikana: " + (result.error || "Jaribu tena"));
                }
            } catch (err) {
                console.error(err);
                alert("Hitilafu ya mtandao wakati wa kuwasiliana na seva.");
            }
        };

        // Pakia taarifa ukurasa unapofunguka
        loadNotification();
        loadGroups();
    </script>

</body>
</html>
